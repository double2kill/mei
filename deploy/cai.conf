server {
  listen 80;
  server_name cai.greatwebtech.cn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name cai.greatwebtech.cn;
  ssl_certificate /etc/nginx/cert/xiaoyoung.greatwebtech.cn_bundle.pem;
  ssl_certificate_key /etc/nginx/cert/xiaoyoung.greatwebtech.cn.key;
  client_max_body_size 20m;

  location /admin/ {
    proxy_redirect off;
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Headers' '*';
      add_header 'Access-Control-Allow-Methods' '*';
      return 204;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8655/admin/;
  }

  location /api/ {
    proxy_redirect off;
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Headers' '*';
      add_header 'Access-Control-Allow-Methods' '*';
      return 204;
    }
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8655/;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /static/ {
    root /home/liuchen/pm2/mei/web/dist;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    root /home/liuchen/pm2/mei/web/dist;
    index index.html index.htm;
    try_files $uri $uri/ /index.html?$args;
  }
}
